# MoRSE — environment for Qwen3 / Llama-3.1 backbones (transformers 4.57.x).
# Use this for all SRDD and SciCode runs with Qwen3-4B-Instruct / Llama-3.1-8B-Instruct.
name: morse-qwen-llama
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.9.1                  # install the build matching your CUDA (see README)
      - transformers==4.57.1
      - tokenizers==0.22.1
      - peft==0.18.1
      - accelerate==1.11.0
      - safetensors==0.6.2
      - sentence-transformers==5.2.0  # gte-Qwen2 encoder for the SRDD consistency reward
      - numpy==2.3.5
      - scipy==1.16.3
      - scikit-learn==1.8.0
      - pandas==2.3.2
      - sympy==1.14.0
      - h5py==3.15.1                  # SciCode numerical ground truth (test_data.h5)
      - bitsandbytes==0.48.2
      - wandb==0.23.1
